unbind C-a
set-option -g prefix C-a
bind-key a send-prefix

# show popup with bash to execute commands
unbind-key e
bind-key e display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80%

# open file in vim
# only when fzf installed and tmux >3.4
unbind-key o
bind-key o run-shell -b "
( find #{pane_current_path} -type f |
fzf --tmux '70%' --preview 'bat --color=always {}' --bind 'enter:become(tmux neww \"vim {}\")'
) >/dev/null || true"

# indexing from 1
set -g base-index 1
set -g pane-base-index 1

# renumber windows when closing
set -g renumber-windows on

bind-key c new-window -c "#{pane_current_path}"

# new pane creation
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Important! tmux-power must be loaded before prefix-highlight
# see https://github.com/wfxr/tmux-power/issues/8
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'


set -g default-terminal "tmux-256color"
set -g @tmux_power_theme 'moon'
# set prefix position on right
set -g @tmux_power_prefix_highlight_pos 'R'

# Download tpm if not exists
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
